[client]
# "minimal" hides Streamlit's built-in chrome (the top-right "Deploy" button
# and the "..." menu's Streamlit Cloud options), which are unrelated to this
# tool - our app is deployed by hosting it on a Windows machine with
# connectivity to on-prem SSAS/SQL Server and Fabric (see README Section 11),
# not via Streamlit Community Cloud.
toolbarMode = "minimal"

[theme]
# Approximates the Microsoft Fabric/Fluent UI portal look (app.fabric.microsoft.com):
# Fluent "Brand Blue" primary accent, light neutral surfaces, dark neutral text.
primaryColor = "#0F6CBD"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F2F1"
textColor = "#252423"
font = "sans serif"

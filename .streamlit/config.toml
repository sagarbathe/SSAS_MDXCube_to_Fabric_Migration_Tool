[client]
# "minimal" hides Streamlit's built-in chrome (the top-right "Deploy" button
# and the "..." menu's Streamlit Cloud options), which are unrelated to this
# tool - our app is deployed by hosting it on a Windows machine with
# connectivity to on-prem SSAS/SQL Server and Fabric (see README Section 11),
# not via Streamlit Community Cloud.
toolbarMode = "minimal"

[theme]
# Dark Microsoft Fabric-style theme: a darker teal (#006D77) as a dominant
# accent for links, borders, and every clickable button (buttons use
# type="primary" in app.py, which fills solid with primaryColor) - darker
# than Fabric's brand teal (#00B7C3) specifically so white button text stays
# clearly readable (~6:1 contrast ratio), on a near-black, cool-dark canvas
# with teal-tinted surfaces so the accent still reads as dominant throughout.
primaryColor = "#006D77"
backgroundColor = "#0B0F0F"
secondaryBackgroundColor = "#102426"
textColor = "#F3F2F1"
linkColor = "#00B7C3"
borderColor = "#00838C"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
font = "sans serif"

[theme.sidebar]
# Dark teal-tinted sidebar, slightly darker than the main canvas for separation.
primaryColor = "#006D77"
backgroundColor = "#081A1B"
secondaryBackgroundColor = "#0D2325"
textColor = "#F3F2F1"
borderColor = "#00838C"
